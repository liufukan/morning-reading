<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>核验审核码 · DailyReading</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">📖 <span>DailyReading</span> <span class="admin-tag">管理</span></div>
    <div class="user-area">
      <a class="btn btn-ghost" href="admin.html">返回管理</a>
      <a class="btn btn-ghost" href="index.html">返回首页</a>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">核验阅读审核码</h1>
    <p class="page-sub">输入同学的学号和截图上的核验码即可。对应且读满 30 分钟为合格；不对应疑似伪造。</p>

    <section class="admin-section">
      <label class="field"><span>学号</span><input id="vId" type="text" inputmode="numeric" autocomplete="off" /></label>
      <label class="field"><span>核验码</span><input id="vCode" type="text" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXX" autocomplete="off" /></label>
      <button id="verifyBtn" class="btn btn-primary" type="button">核验</button>
    </section>

    <div id="verifyResult" class="verify-result"></div>
  </main>

  <script src="assets/code.js"></script>
  <script src="assets/verify.js"></script>
</body>
</html>
