<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读其他材料 · DailyReading</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar read-topbar">
    <button id="exitBtn" class="btn btn-ghost" type="button">Exit</button>
    <div class="read-title">阅读其他材料</div>
    <span class="topbar-spacer"></span>
  </header>

  <main class="free-main">
    <div id="bigTimer" class="big-timer">00:00</div>
    <div id="pauseHint" class="pause-hint hidden"></div>
    <p class="free-tip">阅读自备材料，读满 30 分钟可换二课学时。点 Exit 生成完成卡片。</p>
  </main>

  <div id="cardModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="modal-card result-card">
      <div id="cardEmoji" class="card-emoji">🎉</div>
      <h2 id="cardTitle" class="card-title">自由阅读已完成</h2>
      <div id="cardBadge" class="card-badge ok"></div>
      <dl class="card-fields">
        <div><dt>姓名</dt><dd id="cardName"></dd></div>
        <div><dt>学号</dt><dd id="cardId"></dd></div>
        <div><dt>开始时间</dt><dd id="cardStart"></dd></div>
        <div><dt>结束时间</dt><dd id="cardEnd"></dd></div>
        <div><dt>有效时长</dt><dd id="cardDuration"></dd></div>
        <div><dt>审核码</dt><dd id="cardCode" class="card-code"></dd></div>
      </dl>
      <p class="card-tip">截图本卡片，到二课系统申请学时。</p>
      <div class="modal-actions">
        <button id="cardContinue" class="btn btn-ghost" type="button">继续阅读</button>
        <button id="cardHome" class="btn btn-primary" type="button">返回首页</button>
      </div>
    </div>
  </div>

  <script src="assets/code.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/timer.js"></script>
  <script src="assets/free.js"></script>
</body>
</html>
