<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读 · DailyReading</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/vendor/text_layer.css" />
</head>
<body>
  <header class="topbar read-topbar">
    <button id="exitBtn" class="btn btn-ghost" type="button">Exit</button>
    <div id="readTitle" class="read-title">阅读</div>
    <div id="timer" class="timer">0:00</div>
    <button id="transToggle" class="btn btn-ghost" type="button" aria-expanded="false">翻译</button>
  </header>

  <main class="reader">
    <div id="pauseHint" class="pause-hint hidden"></div>
    <div id="pdfStatus" class="pdf-status">材料加载中…</div>
    <div id="pdfContainer" class="pdf-container"></div>
  </main>

  <div id="cardModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="modal-card result-card">
      <div id="cardEmoji" class="card-emoji">🎉</div>
      <h2 id="cardTitle" class="card-title">阅读已完成</h2>
      <div id="cardBadge" class="card-badge ok"></div>
      <dl class="card-fields">
        <div><dt>姓名</dt><dd id="cardName"></dd></div>
        <div><dt>学号</dt><dd id="cardId"></dd></div>
        <div><dt>开始时间</dt><dd id="cardStart"></dd></div>
        <div><dt>结束时间</dt><dd id="cardEnd"></dd></div>
        <div><dt>有效时长</dt><dd id="cardDuration"></dd></div>
        <div><dt>审核码</dt><dd id="cardCode" class="card-code"></dd></div>
      </dl>
      <p class="card-tip">截图本卡片，到二课系统申请学时。</p>
      <div class="modal-actions">
        <button id="cardContinue" class="btn btn-ghost" type="button">继续阅读</button>
        <button id="cardHome" class="btn btn-primary" type="button">返回首页</button>
      </div>
    </div>
  </div>

  <aside id="transPanel" class="trans-panel" aria-label="划词翻译">
    <div class="trans-head">
      <span class="trans-title">划词翻译</span>
      <button id="transClose" class="trans-x" type="button" aria-label="关闭翻译面板">×</button>
    </div>
    <div class="trans-body">
      <div class="trans-label">原文</div>
      <div id="transSrc" class="trans-src"></div>
      <div class="trans-label">译文</div>
      <div id="transOut" class="trans-out"></div>
      <div id="transStatus" class="trans-status"></div>
      <div id="transKeyRow" class="trans-key hidden">
        <input id="transKeyInput" type="password" placeholder="学校 API key（仅存本机）" autocomplete="off" />
        <button id="transKeySave" class="btn btn-ghost" type="button">保存</button>
      </div>
      <div class="trans-tools">
        <select id="transModel" class="trans-model" aria-label="翻译模型">
          <option value="qwen3.8-chat">qwen3.8-chat</option>
          <option value="deepseek-flash">deepseek-flash</option>
          <option value="glm-5.3-flash">glm-5.3-flash</option>
          <option value="smart/default">smart/default</option>
        </select>
        <button id="transRetry" class="btn btn-ghost" type="button">重译</button>
        <button id="transCopy" class="btn btn-ghost" type="button">复制</button>
      </div>
    </div>
  </aside>

  <script src="assets/vendor/pdf.min.js"></script>
  <script src="assets/code.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/timer.js"></script>
  <script src="assets/read.js"></script>
  <script src="assets/translate.js"></script>
</body>
</html>
